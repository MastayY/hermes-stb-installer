# hermes-stb-installer — compose/docker-compose.yml
#
# Images and network pattern verified against upstream source:
#   - decolua/9router:latest        (github.com/decolua/9router, official docker-compose.yml)
#   - nousresearch/hermes-agent:latest (github.com/NousResearch/hermes-agent, multi-arch incl. aarch64
#     per website/docs/user-guide/docker.md)
#
# Works with both `docker compose` and `podman compose` (podman is the
# installer default — see lib/runtime-select.sh).
#
# Design notes:
#   - hermes uses network_mode: host, matching upstream's own compose file —
#     this means it reaches 9router simply via http://localhost:20128, no
#     custom bridge network or service-name DNS needed.
#   - No port is published for hermes itself: Telegram uses outbound
#     long-polling by default, so nothing needs to accept inbound connections.
#   - 9router's dashboard (port 20128) is reachable on the LAN by default.
#     There is no reverse proxy here — see compose/docker-compose.proxy.yml,
#     only used when install.sh is run with --with-proxy.

services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - ../data/9router:/app/data
    # Least privilege: only 9router's own settings (generated by install.sh
    # into data/9router.env). It does NOT get Telegram/Hermes variables.
    env_file:
      - ../data/9router.env
    # 9router's own /api/health endpoint (verified in source AND against a live instance).
    # Uses node itself (the image is node:alpine) rather than assuming wget/curl exist.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 480m

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    depends_on:
      9router:
        condition: service_healthy
    volumes:
      - ../data/hermes:/opt/data
    # Least privilege: only Telegram/Hermes variables (data/hermes.env). Hermes
    # never sees provider API keys, JWT_SECRET or the 9router admin password —
    # it reaches providers only through 9router, using its own API key from
    # data/hermes/config.yaml.
    env_file:
      - ../data/hermes.env
    command: ["gateway", "run"]
    mem_limit: 768m
