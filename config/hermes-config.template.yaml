# Hermes Agent Configuration for STB Homelab
_config_version: 46

model:
  provider: "custom"
  base_url: "http://router:20128/v1"
  default: "combo-primary"

terminal:
  backend: "local"
  timeout: 180

agent:
  disabled_toolsets:
    - browser
    - vision
    - image_gen
    - video_gen
    - tts
    - computer_use

browser:
  backend: "off"

compression:
  enabled: true
  threshold: 0.50
  protect_last_n: 10
